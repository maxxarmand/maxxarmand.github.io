<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js"></script>
    <style>  
      .box {
        
        width: 86px;
        height: 70px;
        background-image: url("images/pumpkin.png");
        background-repeat: no-repeat;
        background-size: cover;
        font-size: 300%;
        text-align: center;
        user-select: none;
        display: block;
        position: absolute;
        top: 100px;
        /* Change me! */
        left: 0px;
        
      }

      .board {
        height: 100vh;
        background-color: rgb(0, 0, 0);
        border-color: greenyellow;
        border-style: groove;
        border-width: 12px;
        margin: -10px;
      }
    </style>
    <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
  </head>

  <body class="board">
    <!-- HTML for the box -->
    <div class="box">?</div>

    <script>
     
      (function () {
        "use strict";
        /* global jQuery */

        //////////////////////////////////////////////////////////////////
        /////////////////// SETUP DO NOT DELETE //////////////////////////
        //////////////////////////////////////////////////////////////////

        var box = jQuery(".box"); // reference to the HTML .box element
        var board = jQuery(".board"); // reference to the HTML .board element
        var boardWidth = board.width(); // the maximum X-Coordinate of the screen
        var positionX = 5;
        var positionY = 5;
        var points = 0
        var speed = 10
        var speedY = 10
        var boardHeight = jQuery(window).height();
        var hasWon = false
        var hasLost =false
        var totalclicks = 0
        // update the boardWidth variable when the window is resized
        jQuery(window).on("resize", function () {
          boardWidth = board.width();
        });

        // Every 50 milliseconds, call the update Function (see below)
        setInterval(update, 50);

        // Every time the box is clicked, call the handleBoxClick Function (see below)
        box.on("click", handleBoxClick);
        board.on("click", handleBoardClick);
        // moves the Box to a new position on the screen along the X-Axis
        function moveBoxTo(newPositionX , newPositionY) {
          box.css("left", newPositionX);
          box.css("top", newPositionY)
        }

        // changes the text displayed on the Box
        function changeBoxText(newText) {
        box.text(newText);
        }

        //////////////////////////////////////////////////////////////////
        /////////////////// YOUR CODE BELOW HERE /////////////////////////
        //////////////////////////////////////////////////////////////////

        // TODO 2 - Variable declarations





        /**
         * This Function will be called 20 times/second.
         * Each time it is called, it should move the Box to a new location.
         * If the box drifts off the screen, turn it around!
         */
        function update() {
          moveBoxTo(positionX, positionY);
          positionX +=speed
          if (positionX >= boardWidth-85 && hasWon === false){
            speed = speed *-1
        } else if (positionX < 0 && hasWon === false){
          speed = speed *-1
        } else if(hasWon === true){speed = 10}

         positionY +=speedY
          if (positionY >= boardHeight-55 && hasWon === false){
            speedY = speedY *-1
        } else if (positionY < 0 && hasWon === false){
          speedY = speedY *-1
        }
        


      }
        /**
         * This Function will be called each time the box is clicked.
         * Each time it is called, it should perform each of the following actions:
         * - increase the points total
         * - increase the speed
         * - move the box to the left side of the screen.
         */
        function handleBoxClick() {
          var randNum = Math.random() * 800;
          positionX = randNum;
          positionY = randNum;
          changeBoxText(points);
          points += 1
          if(points === 3){
            speed = 3 * 3 + 10
            console.log (speed)
          } else if (points === 6){
            speed = 3 * 6 + 10
            console.log (speed)
          }else if (points === 9){
            speed = 3 * 9 + 10
            console.log (speed)
          }else if (points === 10){
            speed = 30
            hasWon = true
          }
          if(hasWon === true){
          alert ("You've Won")
          speedY = 0
        }
          
         
        }
        function handleBoardClick(){
          totalclicks += 1
          console.log (points, " ", totalclicks )
          if(points !== totalclicks){
          hasLost = true
          console.log ("looser")
          }
          if(hasLost === true){
          alert ("You Suck")
          speed = 0
          speedY = 0
        }
          
        }

        
      })();
    </script>
  </body>
</html>
